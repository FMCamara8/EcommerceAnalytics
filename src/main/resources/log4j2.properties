
# Réglage du journal (log) de Spark, lu par Log4j 2 dès le démarrage du programme.
# À ranger dans src/main/resources, à côté de application.conf.

# Niveau général : on n'affiche que les avertissements (WARN) et les erreurs (ERROR)
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

# Où écrire et sous quelle forme : dans la console, au format habituel de Spark
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Erreur connue sous Windows à l'arrêt de Spark : le dossier temporaire
# ne peut pas être effacé. Elle est sans conséquence, on la fait taire.
logger.nettoyage.name = org.apache.spark.util.ShutdownHookManager
logger.nettoyage.level = off